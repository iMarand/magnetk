# Magnetk P2P Configuration
# All values are optional - defaults are used when not specified

# ===== Chunking =====
CHUNK_SIZE_MB=1
ADAPTIVE_CHUNKING=true
MAX_PARALLEL_CHUNKS=10

# ADVERTISED_ADDRESS: The public IP that seeds tell peers to connect to.
# On a VPS, set this to your VPS public IP (e.g., 69.169.109.243).
# If empty, STUN auto-discovery is used (may return wrong IP behind NAT).
# On client machines (downloading), leave empty or omit.
ADVERTISED_ADDRESS=69.169.109.243

# ===== Relay =====
RELAY_ADDRESS=0.0.0.0:4001
MAX_RELAY_BUFFER_GB=1
DISK_BACKED_BUFFER=false

# ===== Network Binding =====
# BIND_ADDRESS: The address to listen on
#   0.0.0.0     = All interfaces (default, use for production)
#   127.0.0.1   = Localhost only (use for development/testing)
BIND_ADDRESS=0.0.0.0
DISCOVERY_PORT=4001
TRANSPORT_PORT=4002
# LOCALHOST_MODE: If true, overrides BIND_ADDRESS to 127.0.0.1
LOCALHOST_MODE=false

# ===== TLS / Security =====
# TLS_CERT_FILE and TLS_KEY_FILE: paths to PEM files
# Leave empty for self-signed certificates (development mode)
TLS_CERT_FILE=
TLS_KEY_FILE=
NO_CERT_VALIDATION=true

# ===== Performance =====
MAX_CONNECTIONS=1000
MAX_STREAMS_PER_CONNECTION=100
SEND_BUFFER_SIZE_MB=4
RECV_BUFFER_SIZE_MB=4

# ===== Environment =====
# ENV: development | staging | production
ENV=development

# ===== Connection Health =====
PING_INTERVAL_SEC=10
RETRY_BACKOFF_SEC=5

# ===== State Persistence =====
STATE_DIR=./transfer_states
STATE_EXPIRY_DAYS=7

# ===== Logging =====
LOG_LEVEL=info
LOG_FILE=./magnetk.log

# ===== Relay Features =====
ENABLE_TRAFFIC_ROUTING=true
ENABLE_ANALYTICS=true

# ===== Multi-relay =====
# RELAY_ADDRESSES= (comma-separated list of multiaddrs)
RELAY_ADDRESSES=

# ===== DHT (Decentralized Discovery) =====
# Enable DHT for peer-to-peer discovery without central relay
DHT_ENABLED=false
# Mode: "server" (seeds/relays), "client" (downloaders), "auto" (auto-detect)
DHT_MODE=auto
# Custom bootstrap peers (comma-separated multiaddrs)
# Default: Public IPFS bootstrap nodes
DHT_BOOTSTRAP_PEERS=/dnsaddr/bootstrap.libp2p.io/p2p/QmNnooDu7bfjPFoTZYxMNLWUQJyrVwtbZg5gBMjTezGAJN,/dnsaddr/bootstrap.libp2p.io/p2p/QmQCU2EcMqAqQPR2i9bChDtGNJchTbq5TbXJJ16u19uLTa,/dnsaddr/bootstrap.libp2p.io/p2p/QmbLHAnMoJPWSCR5Zhtx6BHJX9KiKNN6tpvbUcqanj75Nb,/dnsaddr/bootstrap.libp2p.io/p2p/QmcZf59bWwK5XFi76CZX8cbJ4BhTzzA3gU1ZjYZcYW3dwt,/ip4/104.131.131.82/tcp/4001/p2p/QmaCpDMGvV2BGHeYERUEnRQAwe3N8SzbUtfsmvsqQLuvuJ
# How often seeds re-announce to DHT (minutes)
DHT_REANNOUNCE_INTERVAL_MIN=30

# ===== Discovery Priority =====
# Order to try discovery methods (comma-separated: dht, relay, direct)
DISCOVERY_PRIORITY=dht,relay,direct

# ===== Connection Strategy =====
# RELAY_ASSISTED: auto | true | false
#   auto  = try direct P2P first, fall back to relay if unreachable
#   true  = always route data through relay (privacy mode)
#   false = direct P2P only, fail if unreachable
RELAY_ASSISTED=auto
# HOLE_PUNCH: Enable NAT traversal via STUN + libp2p hole punching
HOLE_PUNCH=true
# RELAY_TIMEOUT_MS: How long to wait for direct connection before relay fallback
RELAY_TIMEOUT_MS=5000

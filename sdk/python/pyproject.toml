[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetk"
version = "2.0.0"
description = "Magnetk: fast messaging, pipes and file distribution over QUIC (relay or peer-to-peer)."
readme = "README.md"
authors = [{ name = "iMarand" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Networking",
    "Topic :: Communications",
    "Intended Audience :: Developers",
]
keywords = ["quic", "messaging", "pubsub", "rpc", "p2p", "file-transfer", "relay", "magnetk"]

[project.urls]
Homepage = "https://github.com/iMarand/magnetk"
Documentation = "https://github.com/iMarand/magnetk/blob/main/sdk/python/Documentation.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["magnetk"]

[tool.setuptools.package-data]
# Native libraries copied here by scripts/build (libmagnetk + msquic).
magnetk = ["lib/*.dll", "lib/*.so", "lib/*.so.*", "lib/*.dylib", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
